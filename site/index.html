<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#111315" media="(prefers-color-scheme: dark)">
  <meta name="description" content="Add the public rctl package repository to Cydia, Installer, Sileo, or Zebra.">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src 'self'; style-src 'self'; script-src 'self'; base-uri 'none'; form-action 'none'">
  <title>Add rctl repository</title>
  <link rel="icon" href="CydiaIcon.png">
  <link rel="stylesheet" href="styles.css">
  <script src="site.js" defer></script>
</head>
<body class="repository-body">
  <main class="repository-main">
    <section class="repository-panel" aria-labelledby="page-title">
      <div class="repository-title">
        <img src="CydiaIcon.png" width="56" height="56" alt="">
        <h1 id="page-title">Add rctl</h1>
      </div>

      <p class="repository-summary">Install the public LAN package for jailbroken iOS devices.</p>

      <label class="visually-hidden" for="repository-url">Repository URL</label>
      <input
        id="repository-url"
        class="repository-url"
        type="text"
        value="https://nobottomline.github.io/rctl-repo/"
        readonly
        spellcheck="false"
        aria-describedby="copy-status"
      >

      <nav class="manager-bar" aria-label="Add repository to a package manager">
        <a href="cydia://url/https://cydia.saurik.com/api/share#?source=https://nobottomline.github.io/rctl-repo/">
          <span class="manager-icon cydia-icon" aria-hidden="true">C</span>
          <span>Cydia</span>
        </a>
        <a href="installer://add/repo=https://nobottomline.github.io/rctl-repo/">
          <span class="manager-icon installer-icon" aria-hidden="true">I</span>
          <span>Installer</span>
        </a>
        <a href="sileo://source/https://nobottomline.github.io/rctl-repo/">
          <span class="manager-icon sileo-icon" aria-hidden="true">S</span>
          <span>Sileo</span>
        </a>
        <a href="zbra://sources/add/https://nobottomline.github.io/rctl-repo/">
          <span class="manager-icon zebra-icon" aria-hidden="true">Z</span>
          <span>Zebra</span>
        </a>
      </nav>

      <p class="copy-status" id="copy-status" role="status" aria-live="polite">Tap the address to copy it.</p>

      <div class="repository-meta">
        <span>Version @RCTL_VERSION@</span>
        <span>@RCTL_ARCHITECTURES@</span>
        <span>Rootful iOS 14</span>
      </div>
    </section>
  </main>

  <footer class="repository-footer">
    <nav aria-label="Repository links">
      <a href="https://github.com/nobottomline/rctl">Source</a>
      <a href="https://github.com/nobottomline/rctl/releases">Releases</a>
      <a href="rctl-repo-key.asc">Signing key</a>
    </nav>
    <span>Public LAN package only</span>
  </footer>
</body>
</html>
