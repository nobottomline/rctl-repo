name: Publish APT repository

on:
  push:
    branches: [main]
    paths:
      - releases.txt
      - repository.json
      - scripts/**
      - site/**
      - .github/workflows/pages.yml
  workflow_dispatch:

concurrency:
  group: apt-repository-pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-24.04
    environment: apt-repository-signing
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Install repository tooling
        run: |
          sudo apt-get update
          sudo apt-get install --yes apt-utils dpkg-dev gnupg xz-utils zstd
      - name: Build and verify repository
        env:
          APT_REPOSITORY_SIGNING_KEY_B64: ${{ secrets.APT_REPOSITORY_SIGNING_KEY_B64 }}
          GH_TOKEN: ${{ github.token }}
        run: scripts/build-repository.sh _site
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
      - name: Verify published indexes
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          base="${PAGE_URL%/}"
          for path in index.html styles.css site.js Release Release.gpg InRelease Packages Packages.gz Packages.bz2 Packages.xz Packages.zst rctl-repo-key.asc; do
            ready=false
            for _ in $(seq 1 30); do
              if curl --proto '=https' --tlsv1.2 --fail --silent --show-error \
                --connect-timeout 10 --max-time 30 "$base/$path" --output "/tmp/$path"; then
                ready=true
                break
              fi
              sleep 5
            done
            test "$ready" = true
            test -s "/tmp/$path"
          done
          grep -F 'Package: com.greatlove.rctl' /tmp/Packages >/dev/null
          grep -F 'cydia://url/' /tmp/index.html >/dev/null
          grep -F 'installer://add/repo=' /tmp/index.html >/dev/null
          grep -F 'sileo://source/' /tmp/index.html >/dev/null
          grep -F 'zbra://sources/add/' /tmp/index.html >/dev/null
